<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Noavus Vote</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:
radial-gradient(circle at top,#0d2a52 0,#07101f 35%,#02060d 100%);min-height:100vh;color:#fff}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:min(430px,100%);background:rgba(10,18,32,.92);border:1px solid rgba(74,190,255,.35);border-radius:28px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 35px rgba(0,170,255,.08)}
.logo{width:88px;height:88px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(145deg,#1f6fff,#20d4ff);font-size:54px;font-weight:900;box-shadow:0 0 26px rgba(32,212,255,.45)}
h1{text-align:center;margin:0;font-size:44px;letter-spacing:1px}
.sub{text-align:center;color:#6ee7ff;font-weight:800;margin-top:4px}
.status{text-align:center;margin:26px 0 18px;color:#ffbd66}
.status.done{color:#72e38e}
.grid{display:grid;gap:14px}
.btn{display:block;text-decoration:none;color:#fff;text-align:center;padding:18px 16px;border-radius:18px;font-size:18px;font-weight:900;background:linear-gradient(90deg,#2067ff,#14bde6);box-shadow:0 8px 24px rgba(20,189,230,.22)}
.btn.secondary{background:linear-gradient(90deg,#244055,#315d79)}
.donebtn{width:100%;border:0;color:#fff;padding:14px;border-radius:16px;font-size:16px;font-weight:800;background:#173c2a;margin-top:18px}
.note{opacity:.65;text-align:center;font-size:13px;line-height:1.35;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
<main class="card">
<div class="logo">N</div>
<h1>NOAVUS</h1>
<div class="sub">VOTE REMINDER</div>
<div id="status" class="status">Heute noch nicht als erledigt markiert</div>
<div class="grid">
<a class="btn" href="https://minecraft-server.eu/vote/index/208F7/Noavus" target="_blank" rel="noopener">VOTE 1 ÖFFNEN</a>
<a class="btn" href="https://www.minecraft-serverlist.net/vote/51076/Noavus" target="_blank" rel="noopener">VOTE 2 ÖFFNEN</a>
</div>
<button id="done" class="donebtn">Für heute erledigt</button>
<div class="note">Auf dem iPhone in Safari öffnen → Teilen → „Zum Home-Bildschirm“.</div>
</main>
</div>
<script>
const key='noavus_last_vote';
const today=()=>new Date().toISOString().slice(0,10);
const status=document.getElementById('status');
const btn=document.getElementById('done');
function paint(){
 const done=localStorage.getItem(key)===today();
 status.textContent=done?'Heute bereits erledigt ✅':'Heute noch nicht als erledigt markiert';
 status.classList.toggle('done',done);
 btn.textContent=done?'Als nicht erledigt markieren':'Für heute erledigt';
}
btn.onclick=()=>{
 if(localStorage.getItem(key)===today()) localStorage.removeItem(key);
 else localStorage.setItem(key,today());
 paint();
};
paint();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
</html>
